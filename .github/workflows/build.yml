name: Masaüstü uygulaması

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri -> target' }
      - run: npm install
      - name: Derle (Intel + Apple Silicon)
        run: npx tauri build --target universal-apple-darwin
      - name: Geçici imza (ad-hoc)
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/MA Haber Merkezi.app"
          codesign --force --deep --sign - "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri -> target' }
      - run: npm install
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
