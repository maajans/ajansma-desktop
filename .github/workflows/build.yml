name: Masaüstü uygulaması

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  macos:
    name: macOS (universal, imzalı + notarize)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri -> target' }
      - run: npm install
      - name: Derle · imzala · notarize et
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --target universal-apple-darwin
      - name: İmza ve bilet doğrulaması (DMG içindeki uygulama)
        run: |
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          MNT=$(hdiutil attach "$DMG" -nobrowse -readonly | tail -1 | awk '{print $NF}')
          echo "bağlandı: $MNT"
          APP="$MNT/MA Haber Merkezi.app"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|flags" || exit 1
          codesign --verify --deep --strict --verbose=2 "$APP" || exit 1
          xcrun stapler validate "$APP" && echo "bilet yapıştırıldı"
          spctl -a -vvv -t exec "$APP" || true
          hdiutil detach "$MNT" -quiet || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri -> target' }
      - run: npm install
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
